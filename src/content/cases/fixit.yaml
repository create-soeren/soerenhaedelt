head:
  kind: statement
  label: Fixit
  title: Laying the foundation
  from: Build the whole app first
  to: Prove it with a prototype
  media:
    src: ./media/fixit-hero-2023.jpg
    alt: "Fixit prototype on a phone in front of a light gradient: the choice of a package, Quick Fix, Comfort Fix or Guide, each with its length and price"
    caption: Prototype 2023 · Choosing a package in the booking flow.
  impact:
    value: €10,000
    label:
      - founder prize, pitched with this prototype
  meta:
    - label: Role
      value: UX Designer (Freelance)
    - label: Period
      value: 11.2023 – 12.2023, 4 weeks
    - label: Client
      value: Fixit, today amendio. Pre-seed startup for remote household repairs
    - label: Scope
      value: Interview analysis, persona, user flow, information architecture, mid-fidelity prototype
blocks:
  - type: chapter
    decision: One persona from the interviews.
    why:
      - "Fixit had already interviewed potential users when I joined. I sorted the interviews in an affinity map: motivations, emotional needs, expectations, fears and barriers."
      - From that came Jesse, Fixit’s first persona. Every product decision could be checked against her.
    evidence:
      - kind: image
        src: ./media/fixit-persona-jesse-2023.jpg
        alt: "Persona Jesse, a busy journalist in Berlin: motivations and goals, needs, expectations from the service, pain points, barriers and three quotes"
        caption: 2023 · Jesse, Fixit’s first persona.
  - type: chapter
    decision: Tools from a partner shop.
    why:
      - "Before the call, the professional lists the tools the fix needs. I linked that list to a partner shop: Fixit earns on the tools, and the user gets everything for the repair in one place."
      - "Partner offers appear in two places of the flow: when a problem is too complicated for a remote fix, and when the user lacks the tools."
    evidence:
      - kind: image
        src: ./media/fixit-user-flow-2023.png
        alt: "Excerpt of the Fixit user flow: a branch to partner offers if the problem is too complicated, then a cost comparison, the list of tools and a second branch to partner offers if the user lacks tools"
        caption: "2023 · An excerpt of the user flow, with partner offers in two places."
        full:
          src: ./media/fixit-user-flow-komplett-2023.png
          alt: "The complete Fixit user flow, from the entry screen to feedback. New users pass onboarding, then an AI interaction and a waiting screen. If no handyman is live, the user leaves contact details and gets a notification. After the chat and the diagnosis call, a problem that is too complicated branches to partner offers. Otherwise a cost comparison and the list of tools follow, with a second branch to partner offers if the user lacks tools. Then registration with payment safety and a payment method, or login, the appointment, the video call and automatic payment. If the problem is not solved, the user goes to support and back to the appointment; if it is solved, to feedback."
  - type: chapter
    decision: A website on the phone, not an app.
    why:
      - "A native app raises the barrier and makes the first sign-ups harder on both sides: for people with a broken fuse and for the repair companies Fixit needed on board. The first version ran as a mobile website, on the assumption that people look up a repair on their phone."
      - "I prototyped the flow in mid fidelity, from the first question to the video call with a professional: an AI chat narrows down the problem, three packages set the length of the call, payment runs on its own."
    evidence:
      - kind: video
        src: fixit-hero-2023.mp4
        poster: ./media/fixit-hero-2023.jpg
        loop: false
        alt: "Fixit prototype on a phone in front of a light gradient: the screens scroll past, from the choice of a package through payment and the chat to the cost comparison"
        caption: Prototype 2023 · Package, payment and chat on the phone.
  - type: showcase
    width: half
    portrait: true
    items:
      - kind: image
        src: ./media/fixit-prototyp-pakete-2023.jpg
        rounded: true
        alt: "Fixit prototype on a phone: Choose your package with Quick Fix for 20 euros, Comfort Fix for 40 euros and Guide for 60 euros"
        caption: 2023 · Choose a package.
      - kind: image
        src: ./media/fixit-prototyp-termin-2023.jpg
        rounded: true
        alt: "Fixit prototype on a phone: Schedule your call with the date 20.12 and the times 17:30, 18:00 and 09:30 to 14:00"
        caption: 2023 · Schedule the call.
      - kind: image
        src: ./media/fixit-prototyp-bezahlen-2023.jpg
        rounded: true
        alt: "Fixit prototype on a phone: four payment methods, PayPal, card, Apple Pay and Google Pay, above a greyed-out Continue button"
        caption: 2023 · Choose how to pay.
      - kind: image
        src: ./media/fixit-prototyp-werkzeuge-2023.jpg
        rounded: true
        alt: "Fixit prototype on a phone: a chat with an electrician listing the tools for the fix, a 6er screwdriver, a voltage tester and a wire stripper"
        caption: 2023 · The tool list before the call.
      - kind: image
        src: ./media/fixit-prototyp-warten-2023.jpg
        rounded: true
        alt: "Fixit prototype on a phone: a round assistant with a yellow helmet and the text I’m looking for the right fit for you"
        caption: 2023 · Waiting for a free professional.
  - type: chapter
    decision: A roadmap beyond the prototype.
    why:
      - Alongside the prototype, we laid out a product roadmap for the next stages of Fixit, including the partnerships the user flow already prepares.
      - In April 2024 Fixit pitched with this prototype in a competition and won the Female Founder Prize of Berliner Sparkasse, endowed with €10,000.
  - type: quote
    photo: ../../assets/people/zarangez.jpg
    position: 50% 50%
    text: It was great to see Sören’s commitment to understanding our target audience on a deeper level. He created a detailed persona to truly understand the emotions and motivations of our customers. This translated into a design that not only met functional requirements but also resonated emotionally with our users.
    who: Zarangez Muminova, Co-Founder at Fixit
